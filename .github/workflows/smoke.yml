name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  transcribe-smoke:
    # Apple Silicon (arm64) macOS runner - required for MLX. GitHub's
    # standard macos-15 / macos-latest images are arm64 by default.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Create env and install deps
        run: uv sync --frozen

      - name: Smoke transcribe sample (whisper-tiny)
        run: |
          uv run stt-local tests/sample.mp3 \
            -o tests/out \
            -m mlx-community/whisper-tiny \
            -f srt -f md -f json \
            --word-timestamps

      - name: Validate outputs
        run: uv run python tests/smoke_check.py tests/out

      - name: Polish smoke (mock, no network)
        run: |
          uv run stt-local polish tests/out --mock -o tests/out/polished
          test -f "tests/out/polished/$(ls tests/out | grep '\.json$' | head -1 | xargs basename)"
          python3 -c "
            import json, glob
            f = glob.glob('tests/out/polished/*.json')[0]
            d = json.load(open(f))
            assert d.get('polished') is True, 'polished flag missing'
            assert d['segments'], 'no segments'
            print('POLISH MOCK OK:', len(d['segments']), 'segments')
          "

      - name: Upload transcript artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-transcripts
          path: tests/out/
          if-no-files-found: warn
