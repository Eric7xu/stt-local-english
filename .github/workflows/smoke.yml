name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  transcribe-smoke:
    # Apple Silicon (arm64) macOS runner - required for MLX. GitHub's
    # standard macos-15 / macos-latest images are arm64 by default.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Create env and install deps
        run: uv sync --frozen

      - name: Smoke transcribe sample (whisper-tiny)
        run: |
          uv run stt-local tests/sample.mp3 \
            -o tests/out \
            -m mlx-community/whisper-tiny \
            -f srt -f md -f json \
            --word-timestamps

      - name: Validate outputs
        run: uv run python tests/smoke_check.py tests/out

      - name: Polish smoke (mock, no network)
        run: |
          uv run stt-local polish tests/out --mock -o tests/out/polished
          test -f "tests/out/polished/$(ls tests/out | grep '\.json$' | head -1 | xargs basename)"
          python3 -c "
            import json, glob
            f = glob.glob('tests/out/polished/*.json')[0]
            d = json.load(open(f))
            assert d.get('polished') is True, 'polished flag missing'
            assert d['segments'], 'no segments'
            print('POLISH MOCK OK:', len(d['segments']), 'segments')
          "

      - name: Judge smoke (mock, no network)
        run: |
          uv run python tests/make_judge_fixture.py
          uv run stt-local judge tests/judge-fixture --orig-root tests/out --mock -o tests/out/judge-report.md
          grep -q "diff 总数" tests/out/judge-report.md && echo "JUDGE MOCK OK"

      - name: Transcribe smoke on Linux (faster engine, tiny)
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          uv run stt-local tests/tone.wav --engine faster -m tiny -f json -o tests/out-linux
          python3 -c "
            import json, glob
            d = json.load(open(glob.glob('tests/out-linux/*.json')[0]))
            assert d.get('duration', 0) > 0, 'duration missing'
            print('LINUX TRANSCRIBE OK: duration', d['duration'], 's, language', d.get('language'))
          "

      - name: Upload transcript artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-transcripts
          path: tests/out/
          if-no-files-found: warn

  linux-polish-judge:
    # Linux 证明：polish / judge（纯 Python）跨平台可用，仅 transcribe 限 macOS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync (mlx-whisper skipped via platform marker)
        run: uv sync --frozen
      - name: Build minimal fixture
        run: |
          mkdir -p fixture/orig fixture/polished
          python3 - <<'PY'
          import json
          segs = [{"start": 0.0, "end": 2.0, "text": "Hello clawed code world."},
                  {"start": 2.0, "end": 4.0, "text": "This is a test line."}]
          for d, flag in (("fixture/orig", False), ("fixture/polished", True)):
              doc = {"segments": [dict(s) for s in segs], "language": "en", "duration": 4.0}
              if flag:
                  doc["segments"][0]["text"] = "Hello Claude Code world."
                  doc["polished"] = True
              json.dump(doc, open(f"{d}/sample.json", "w"))
          PY
      - name: Polish smoke on Linux (mock)
        run: |
          uv run stt-local polish fixture/orig --mock -o fixture/polished-mock
          test -f fixture/polished-mock/sample.json && echo "LINUX POLISH MOCK OK"
      - name: Judge smoke on Linux (mock)
        run: |
          uv run stt-local judge fixture/polished --orig-root fixture/orig --mock -o fixture/judge-report.md
          grep -q "diff 总数: 1" fixture/judge-report.md && echo "LINUX JUDGE MOCK OK"
